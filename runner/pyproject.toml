[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memjudge-runner"
version = "0.1.0"
description = "MemJudge hosted runner: API, retrieve job and finish job (Google Cloud Run)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The core package is installed from this repository (see Dockerfile), never from PyPI.
dependencies = [
  "memjudge",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-cloud-firestore>=2.19",
  "google-cloud-kms>=3.0",
  "google-cloud-storage>=2.18",
  "google-cloud-run>=0.10",
  "boto3>=1.35",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
memjudge-runner = "memjudge_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memjudge_runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["memjudge_runner"]
known-third-party = ["memjudge", "fakes", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
