# Versioned price table (USD per 1M tokens). Used only when an API does not report
# cost itself. Add a model only from the provider's published price list, with the
# date checked. Unknown models are reported as "not reported", never guessed.
version: "2026-10-04"
models:
  anthropic:claude-sonnet-5-5: {input: 2.00, output: 10.00, checked: "2026-09-25"}
  anthropic:claude-opus-5-5: {input: 4.00, output: 20.00, checked: "2026-09-25"}
  anthropic:claude-haiku-4-5: {input: 1.00, output: 5.00, checked: "2026-09-25"}
  openai:gpt-6-luna: {input: 0.10, output: 0.50, checked: "2026-10-04"}
  openai:gpt-6-sol: {input: 2.00, output: 10.00, checked: "2026-10-04"}
  openai:gpt-5.6-terra: {input: 2.00, output: 12.00, checked: "2026-10-04"}
