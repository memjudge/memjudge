name: Deploy runner

# Builds the hosted runner image and deploys the Runner API and its jobs to Google Cloud
# Run (ADR 0009, 0011). Runs when "Run workflow" is pressed on main, or for a v* tag.
# Google access comes from Workload Identity Federation (runner/infra/setup.sh): no keys.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-runner
  cancel-in-progress: false

env:
  PROJECT: memjudge-runner
  REGION: us-central1
  REPO: us-central1-docker.pkg.dev/memjudge-runner/runner/runner
  WIF_PROVIDER: projects/428796325724/locations/global/workloadIdentityPools/github/providers/memjudge
  DEPLOYER: runner-deployer@memjudge-runner.iam.gserviceaccount.com
  API_URL: https://runner-api-428796325724.us-central1.run.app
  SITE_URL: https://memjudge.org

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # Google accepts deploys only from this environment (setup.sh); its rules in the
    # repository settings decide which refs may deploy.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Package version
        id: version
        run: |
          version=$(python3 -c "import re, pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('src/memjudge/__init__.py').read_text(), re.M).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Reuse this commit's image if it was built before
        id: existing
        run: |
          digest=$(gcloud artifacts docker images describe "$REPO:$GITHUB_SHA" \
            --format='value(image_summary.digest)' 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.digest == ''
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          push: true
          provenance: mode=max
          tags: |
            ${{ env.REPO }}:${{ github.sha }}
            ${{ env.REPO }}:${{ steps.version.outputs.version }}
      - name: Deploy
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: bash runner/infra/deploy.sh
