name: Bug report
description: Something in MemJudge does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output. Remove any API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: memjudge version and OS
      placeholder: "memjudge 0.1.0, Ubuntu 24.04, Python 3.12"
    validations:
      required: true
